<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姜凯耀</title>
<!--
  ============================================================
  姜凯耀的个人主页（星空宇宙风）。
  所有内容都在这个文件夹里：
    - index.html          主页（改文字搜 ✏️）
    - articles.js         文章列表（写作文库）
    - articles/           每篇文章一个 html 文件
    - avatar.jpg          你的头像（放一张叫 avatar.jpg 的图片即可）
  ============================================================
-->
<style>
  :root{
    --txt:#e8ecf4; --muted:#9aa6bd; --accent:#7fb3ff; --accent2:#b48cff;
    --card:rgba(20,26,40,.55); --line:rgba(255,255,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--txt);line-height:1.85;
    background:radial-gradient(ellipse at 50% -10%,#1b2a52 0%,#0d1230 45%,#060912 100%);
    min-height:100vh;overflow-x:hidden;
  }
  /* 星空画布固定在背景 */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 22px;}

  /* 顶部 */
  header{padding:72px 0 12px;text-align:center;}
  .avatar{
    width:120px;height:120px;border-radius:50%;margin:0 auto 20px;
    position:relative;cursor:pointer;overflow:hidden;
    border:2px solid var(--accent);box-shadow:0 0 30px rgba(127,179,255,.4);
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;transition:.25s;
  }
  .avatar:hover{transform:scale(1.05);}
  .avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .avatar .ph{font-size:46px;color:#fff;font-weight:700;}
  .avatar .hint{
    position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);
    color:#fff;font-size:11px;text-align:center;padding:2px 0;opacity:0;transition:.2s;
  }
  .avatar:hover .hint{opacity:1;}
  .name{font-size:40px;letter-spacing:4px;font-weight:700;text-shadow:0 0 24px rgba(127,179,255,.5);}
  .enname{color:var(--muted);font-size:13px;letter-spacing:2px;margin-top:6px;}
  .motto{margin-top:16px;font-size:16px;color:var(--muted);}
  .motto .dot{color:var(--accent);margin:0 10px;}
  nav{margin-top:22px;display:flex;justify-content:center;gap:24px;font-size:14px;flex-wrap:wrap;}
  nav a{color:var(--txt);text-decoration:none;padding:4px 2px;border-bottom:1px solid transparent;transition:.2s;}
  nav a:hover{color:var(--accent);border-bottom-color:var(--accent);}

  .divider{text-align:center;margin:30px 0 4px;color:var(--muted);font-size:13px;letter-spacing:3px;}

  /* 区块 */
  section{margin:30px 0;}
  h2{font-size:16px;font-weight:700;letter-spacing:2px;margin-bottom:16px;padding-left:12px;border-left:3px solid var(--accent);}
  p{font-size:15px;}

  /* 玻璃卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;backdrop-filter:blur(8px);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.2s;}
  .item:hover{transform:translateY(-3px);border-color:var(--accent);}
  .item h3{font-size:15px;margin-bottom:6px;}
  .item p{font-size:13px;color:var(--muted);line-height:1.7;}

  /* 写作专区 */
  .post{
    display:block;text-decoration:none;color:var(--txt);
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;margin-bottom:12px;transition:.2s;
  }
  .post:hover{border-color:var(--accent);transform:translateX(4px);}
  .post .t{font-size:16px;font-weight:600;}
  .post .d{font-size:12px;color:var(--muted);margin:4px 0 6px;}
  .post .s{font-size:13px;color:var(--muted);}

  .friends{display:flex;flex-wrap:wrap;gap:12px;}
  .friends a{color:var(--txt);text-decoration:none;font-size:14px;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);transition:.2s;}
  .friends a:hover{color:var(--accent);border-color:var(--accent);}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:40px 0 54px;letter-spacing:1px;}

  input[type=file]{display:none;}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<!-- ✏️ 头像上传：点击圆形头像即可从电脑选择图片 -->
<input type="file" id="avatarInput" accept="image/*">

<header class="wrap">
  <div class="avatar" id="avatarBox" title="点击上传头像">
    <img id="avatarImg" alt="头像">
    <span class="ph" id="avatarPh">Kai</span>
    <span class="hint">点击更换头像</span>
  </div>

  <!-- ✏️ 名字 -->
  <div class="name">姜凯耀</div>
  <!-- ✏️ 英文名/拼音 -->
  <div class="enname">JIANG KAIYAO</div>
  <!-- ✏️ 座右铭 -->
  <div class="motto">仰望星空<span class="dot">·</span>脚踏实地</div>

  <nav>
    <a href="#about">关于</a>
    <a href="#thoughts">思想记录</a>
    <a href="#writing">写作</a>
    <a href="#friends">友链</a>
  </nav>
</header>

<div class="divider">— 往下，慢慢读 ↓ —</div>

<div class="wrap">

  <section id="about">
    <h2>关于我</h2>
    <div class="card">
      <!-- ✏️ 自我介绍 -->
      <p>你好，我是姜凯耀。这里是我的个人主页，也是一份持续更新的公开笔记：记录我的思考、学习和写作。欢迎你来逛逛。</p>
    </div>
  </section>

  <section id="thoughts">
    <h2>思想记录</h2>
    <!-- ✏️ 思想记录：每个 <div class="item">…</div> 是一条，可复制增删 -->
    <div class="grid">
      <div class="item"><h3>一条思考</h3><p>在这里写下你最近的想法、感悟或读书心得。</p></div>
      <div class="item"><h3>一条思考</h3><p>在这里写下你最近的想法、感悟或读书心得。</p></div>
      <div class="item"><h3>一条思考</h3><p>在这里写下你最近的想法、感悟或读书心得。</p></div>
    </div>
  </section>

  <section id="writing">
    <h2>写作</h2>
    <!-- 文章列表由 articles.js 自动生成，点击标题即可阅读全文 -->
    <div id="postList"></div>
  </section>

  <section id="friends">
    <h2>友链</h2>
    <!-- ✏️ 友链：每个 <a> 是一个朋友 -->
    <div class="friends">
      <a href="https://yeyaozhi.eu.cc" target="_blank">叶耀之</a>
      <a href="#" target="_blank">朋友二</a>
    </div>
  </section>

</div>

<footer>© 2026 姜凯耀 · 仰望星空 · 脚踏实地</footer>

<script>
/* ===== 星空动态背景 ===== */
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d');
  var stars=[],W,H,t=0;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<220;i++){
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,
      tw:.5+Math.random()*1.5,ph:Math.random()*6.28,drift:.0002+Math.random()*.0006});
  }
  var shoot={active:false};
  function draw(){
    t+=.016;
    x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.y+=s.drift; if(s.y>1)s.y=0;
      var a=.25+.75*(.5+.5*Math.sin(t*s.tw+s.ph));
      x.globalAlpha=a;x.fillStyle='#fff';
      x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.283);x.fill();
    }
    // 流星
    if(!shoot.active && Math.random()<.005){
      shoot={x:Math.random()*W*.7,y:Math.random()*H*.3,len:90+Math.random()*80,speed:8,life:1};
    }
    if(shoot.active){
      shoot.x+=shoot.speed;shoot.y+=shoot.speed*.45;shoot.life-=.02;
      var g=x.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.len,shoot.y-shoot.len*.45);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
      x.globalAlpha=shoot.life;x.strokeStyle=g;x.lineWidth=1.6;
      x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x-shoot.len,shoot.y-shoot.len*.45);x.stroke();
      if(shoot.life<=0)shoot.active=false;
    }
    x.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ===== 头像上传（从电脑选图片，自动保存在本机浏览器） ===== */
(function(){
  var box=document.getElementById('avatarBox');
  var input=document.getElementById('avatarInput');
  var img=document.getElementById('avatarImg');
  var ph=document.getElementById('avatarPh');
  box.onclick=function(){input.click();};
  input.onchange=function(){
    var f=input.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(e){
      img.src=e.target.result;img.style.display='block';ph.style.display='none';
      try{localStorage.setItem('avatar',e.target.result);}catch(err){}
    };
    r.readAsDataURL(f);
  };
  // 优先用本机保存的头像；否则尝试加载 avatar.jpg
  try{
    var saved=localStorage.getItem('avatar');
    if(saved){img.src=saved;img.style.display='block';ph.style.display='none';}
    else{
      img.onload=function(){img.style.display='block';ph.style.display='none';};
      img.onerror=function(){img.style.display='none';ph.style.display='';};
      img.src='avatar.jpg';
    }
  }catch(err){}
})();

/* ===== 文章列表渲染（读 articles.js） ===== */
(function(){
  var list=document.getElementById('postList');
  if(!window.ARTICLES||!ARTICLES.length){list.innerHTML='<p style="color:#9aa6bd">还没有文章，去 articles.js 里添加吧。</p>';return;}
  var html='';
  ARTICLES.forEach(function(a){
    html+='<a class="post" href="'+a.url+'"><div class="t">'+a.title+'</div><div class="d">'+a.date+'</div><div class="s">'+(a.summary||'')+'</div></a>';
  });
  list.innerHTML=html;
})();
</script>

<script src="articles.js"></script>
</body>
</html>
