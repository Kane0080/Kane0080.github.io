<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姜凯耀 | 个人主页</title>
<meta name="description" content="姜凯耀的个人主页，记录思考、学习与写作。">
<style>
  :root{
    --accent:#7fb3ff; --accent2:#b48cff;
    --txt:#e8ecf4; --muted:#aab4c8;
    --card:rgba(14,18,32,.55); --line:rgba(255,255,255,.14);
    --overlay:rgba(6,9,20,.34);
  }
  [data-theme="light"]{
    --txt:#f4f6fb; --muted:#d3dae8;
    --card:rgba(10,14,28,.4); --line:rgba(255,255,255,.16);
    --overlay:rgba(8,12,26,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--txt);line-height:1.85;min-height:100vh;overflow-x:hidden;
  }
  /* 真实银河照片背景 + 缓慢缩放 */
  .galaxy-bg{position:fixed;inset:0;z-index:-2;background:url('galaxy.jpg') center/cover no-repeat;animation:slowZoom 50s ease-in-out infinite alternate;}
  .galaxy-bg::after{content:'';position:absolute;inset:0;background:var(--overlay);transition:background .4s;}
  @keyframes slowZoom{from{transform:scale(1);}to{transform:scale(1.14);}}

  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 24px;}

  /* 顶部：头像左上 + 名字；右侧大标语向下落下 */
  header{padding:36px 0 14px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;}
  .left{display:flex;align-items:center;gap:18px;}
  .avatar{
    width:82px;height:82px;border-radius:50%;flex-shrink:0;
    position:relative;cursor:pointer;overflow:hidden;
    border:2px solid var(--accent);box-shadow:0 0 24px rgba(127,179,255,.45);
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;transition:.25s;
  }
  .avatar:hover{transform:scale(1.06);}
  .avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .avatar .ph{font-size:32px;color:#fff;font-weight:700;}
  .avatar .hint{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:9px;text-align:center;padding:1px 0;opacity:0;transition:.2s;}
  .avatar:hover .hint{opacity:1;}
  .who .name{font-size:26px;font-weight:700;letter-spacing:2px;text-shadow:0 0 18px rgba(127,179,255,.5);}
  .who .en{color:var(--muted);font-size:12px;letter-spacing:2px;}
  /* 右侧大标语：竖排，向下落下 */
  .big-slogan{
    writing-mode:vertical-rl;font-size:50px;font-weight:700;letter-spacing:10px;
    color:#fff;text-shadow:0 0 22px rgba(127,179,255,.7);white-space:nowrap;
    animation:dropDown 1.3s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes dropDown{from{opacity:0;transform:translateY(-70px);}to{opacity:1;transform:translateY(0);}}

  nav{margin-top:22px;display:flex;gap:22px;font-size:14px;flex-wrap:wrap;}
  nav a{color:var(--txt);text-decoration:none;padding:4px 2px;border-bottom:1px solid transparent;transition:.2s;}
  nav a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .divider{text-align:center;margin:26px 0 4px;color:var(--muted);font-size:13px;letter-spacing:3px;}

  section{margin:28px 0;opacity:0;animation:fadeIn .9s ease forwards;}
  section:nth-of-type(2){animation-delay:.1s;}section:nth-of-type(3){animation-delay:.2s;}
  section:nth-of-type(4){animation-delay:.3s;}section:nth-of-type(5){animation-delay:.4s;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  h2{font-size:16px;font-weight:700;letter-spacing:2px;margin-bottom:16px;padding-left:12px;border-left:3px solid var(--accent);}
  p{font-size:15px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;backdrop-filter:blur(10px);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.2s;}
  .item:hover{transform:translateY(-3px);border-color:var(--accent);}
  .item h3{font-size:15px;margin-bottom:6px;}
  .item p{font-size:13px;color:var(--muted);line-height:1.7;}

  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag{cursor:pointer;font-size:13px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);transition:.2s;}
  .tag:hover,.tag.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .post{display:block;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 20px;margin-bottom:12px;transition:.2s;}
  .post:hover{border-color:var(--accent);transform:translateX(4px);}
  .post .t{font-size:16px;font-weight:600;}
  .post .d{font-size:12px;color:var(--muted);margin:3px 0 5px;}
  .post .s{font-size:13px;color:var(--muted);}

  .friends{display:flex;flex-wrap:wrap;gap:12px;}
  .friends a{color:var(--txt);text-decoration:none;font-size:14px;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);transition:.2s;}
  .friends a:hover{color:var(--accent);border-color:var(--accent);}

  footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;padding:34px 0 50px;letter-spacing:1px;}
  footer .count{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;}

  input[type=file]{display:none;}
  .fab{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:10px;}
  .fab button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:18px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.2);transition:.2s;}
  .fab button:hover{transform:scale(1.1);}
  #backTop{display:none;}
</style>
</head>
<body data-theme="dark">

<div class="galaxy-bg"></div>


<header class="wrap">
  <div class="topbar">
    <div class="left">
      <div class="avatar">
        <span class="ph">Kai</span>
        <img src="avatar.jpg" alt="头像" onerror="this.style.display='none'">
      </div>
      <div class="who">
        <div class="name">姜凯耀</div>
        <div class="en">JIANG KAIYAO</div>
      </div>
    </div>
    <!-- ✏️ 右侧大标语 -->
    <div class="big-slogan">心有明珠，山河明媚</div>
  </div>
  <nav>
    <a href="#about">关于</a>
    <a href="#thoughts">思想记录</a>
    <a href="#writing">写作</a>
    <a href="#friends">友链</a>
    <a href="#comments">评论</a>
  </nav>
</header>

<div class="divider">— 往下，慢慢读 ↓ —</div>

<div class="wrap">

  <section id="about">
    <h2>关于我</h2>
    <div class="card"><p>你好，我是姜凯耀。这里是我的个人主页，也是一份持续更新的公开笔记：记录我的思考、学习和写作。欢迎你来逛逛。</p></div>
  </section>

  <section id="thoughts">
    <h2>思想记录</h2>
    <div class="grid">
      <div class="item"><h3>一条思考</h3><p>在这里写下你最近的想法、感悟或读书心得。</p></div>
      <div class="item"><h3>一条思考</h3><p>在这里写下你最近的想法、感悟或读书心得。</p></div>
      <div class="item"><h3>一条思考</h3><p>在这里写下你最近的想法、感悟或读书心得。</p></div>
    </div>
  </section>

  <section id="writing">
    <h2>写作</h2>
    <div class="tags" id="tagBar"></div>
    <div id="postList"></div>
  </section>

  <section id="friends">
    <h2>友链</h2>
    <div class="friends">
      <a href="https://yeyaozhi.eu.cc" target="_blank">叶耀之</a>
      <a href="#" target="_blank">朋友二</a>
    </div>
  </section>

  <section id="comments">
    <h2>评论区</h2>
    <details class="card"><summary>💬 点击展开 / 收起评论区</summary><div class="giscus"></div></details>
  </section>

</div>

<footer>
  <div>© 2026 姜凯耀 · 心有明珠，山河明媚</div>
  <div class="count">访客 <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fkane0080.github.io&count_bg=%234f6ef7&title_bg=%23555555&title=views&edge_flat=false" alt="访问量"></div>
</footer>

<div class="fab">
  <button id="themeBtn" title="切换深浅色">🌙</button>
  <button id="backTop" title="回到顶部">↑</button>
</div>

<script>
(function(){
  var btn=document.getElementById('themeBtn');
  function set(t){document.body.setAttribute('data-theme',t);btn.textContent=(t==='dark'?'🌙':'☀️');try{localStorage.setItem('theme',t);}catch(e){}}
  btn.onclick=function(){set(document.body.getAttribute('data-theme')==='dark'?'light':'dark');};
  try{var s=localStorage.getItem('theme');if(s)set(s);}catch(e){}
})();
(function(){
  var b=document.getElementById('backTop');
  addEventListener('scroll',function(){b.style.display=scrollY>500?'block':'none';});
  b.onclick=function(){scrollTo({top:0,behavior:'smooth'});};
})();

(function(){
  var list=document.getElementById('postList'),tagBar=document.getElementById('tagBar');
  var A=window.ARTICLES||[];
  if(!A.length){list.innerHTML='<p style="color:var(--muted)">还没有文章，去 articles.js 里添加吧。</p>';return;}
  var tags=['全部'];
  A.forEach(function(a){(a.tags||[]).forEach(function(t){if(tags.indexOf(t)<0)tags.push(t);});});
  tagBar.innerHTML=tags.map(function(t,i){return '<span class="tag'+(i===0?' on':'')+'" data-t="'+t+'">'+t+'</span>';}).join('');
  function render(filter){
    var html='';
    A.forEach(function(a){
      if(filter!=='全部'&&(a.tags||[]).indexOf(filter)<0)return;
      html+='<a class="post" href="'+a.url+'"><div class="t">'+a.title+'</div><div class="d">'+a.date+(a.tags&&a.tags.length?' · '+a.tags.join(' / '):'')+'</div><div class="s">'+(a.summary||'')+'</div></a>';
    });
    list.innerHTML=html||'<p style="color:var(--muted)">该分类暂无文章。</p>';
  }
  tagBar.onclick=function(e){var t=e.target;if(t.className.indexOf('tag')<0)return;
    Array.prototype.forEach.call(tagBar.children,function(c){c.classList.remove('on');});t.classList.add('on');render(t.getAttribute('data-t'));};
  render('全部');
})();
</script>
